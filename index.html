
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Signup & Login</title>

    <link rel="stylesheet"
        href="style.css">
</head>

<body>

    <div class="container">

        <div class="form-box">

            <div class="logo">
                🔐
            </div>

            <h1 id="formTitle">
                Create Account
            </h1>

            <p class="subtitle"
                id="formSubtitle">
                Sign up to create your account
            </p>


            <!-- SIGNUP FORM -->

            <form id="signupForm">

                <div class="input-group">

                    <label>Name</label>

                    <input
                        type="text"
                        id="signupName"
                        placeholder="Enter your name"
                        required>

                </div>


                <div class="input-group">

                    <label>Email</label>

                    <input
                        type="email"
                        id="signupEmail"
                        placeholder="Enter your email"
                        required>

                </div>


                <div class="input-group">

                    <label>Phone Number</label>

                    <input
                        type="tel"
                        id="signupPhone"
                        placeholder="Enter 10-digit phone number"
                        maxlength="10"
                        required>

                </div>


                <div class="input-group">

                    <label>Password</label>

                    <input
                        type="password"
                        id="signupPassword"
                        placeholder="Enter password"
                        required>

                </div>


                <div class="input-group">

                    <label>Confirm Password</label>

                    <input
                        type="password"
                        id="confirmPassword"
                        placeholder="Confirm your password"
                        required>

                </div>


                <button
                    type="submit"
                    class="main-btn">
                    Create Account
                </button>

            </form>


            <!-- LOGIN FORM -->

            <form id="loginForm"
                class="hidden">

                <div class="input-group">

                    <label>
                        Email or Phone Number
                    </label>

                    <input
                        type="text"
                        id="loginUser"
                        placeholder="Enter email or phone"
                        required>

                </div>


                <div class="input-group">

                    <label>Password</label>

                    <input
                        type="password"
                        id="loginPassword"
                        placeholder="Enter password"
                        required>

                </div>


                <button
                    type="submit"
                    class="main-btn">
                    Login
                </button>

            </form>


            <p id="message"></p>


            <div class="switch">

                <span id="switchText">
                    Already have an account?
                </span>

                <button
                    type="button"
                    id="switchButton">
                    Login
                </button>

            </div>

        </div>

    </div>


    <script src="script.js"></script>

</body>

</html>
